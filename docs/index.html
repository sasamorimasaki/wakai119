<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="和会株式会社の公式サイトは現在リニューアル準備中です。電気工事のご相談・お見積もりは通常どおり受け付けております。">
  <title>公式サイト リニューアル準備中 | 和会株式会社</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&amp;family=Zen+Old+Mincho:wght@700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand">
        <img src="assets/logo.png" alt="" width="68" height="60">
        <span>
          <strong>和会株式会社</strong>
          <small>WAKAI Co., Ltd.</small>
        </span>
      </div>
      <div class="header-status" role="note">
        <div class="status-copy">
          <strong>電気工事のご相談・お見積もり受付中</strong>
        </div>
        <a class="contact-button header-contact" href="#contact" data-email-contact>
          <span>お問い合わせ</span>
        </a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow"><span></span> Website renewal</p>
          <h1 id="page-title">
            <span class="heading-line">公式サイトを</span>
            <span class="heading-line heading-highlight">リニューアル中です。</span>
          </h1>
          <p class="lead">弊社の取り組みをお伝えできるサイトを目指して、現在準備を進めております。</p>

        </div>

        <div class="hero-mark" aria-hidden="true">
          <div class="mark-ring">
            <img src="assets/logo.png" alt="" width="430" height="379">
          </div>
        </div>
      </section>

      <section class="company-strip" aria-label="会社情報">
        <div>
          <span class="info-label">Company</span>
          <strong>和会（わかい）株式会社</strong>
        </div>
        <div>
          <span class="info-label">Area</span>
          <strong>千葉県</strong>
        </div>
        <div>
          <span class="info-label">Hours</span>
          <strong>9:00–17:00</strong>
          <small>定休日：月曜日</small>
        </div>
        <div>
          <span class="info-label">Address</span>
          <strong>千葉県八千代市米本1221-31</strong>
        </div>
      </section>
    </main>

    <footer id="contact" class="site-footer">
      <p>&copy; 2026 和会株式会社</p>
      <p>電気工事で、安心と笑顔に変える。</p>
    </footer>
  </div>

  <script>
    const emailContactLink = document.querySelector('[data-email-contact]');

    if (emailContactLink) {
      emailContactLink.addEventListener('click', (event) => {
        event.preventDefault();

        const mailbox = ['in', 'fo'].join('');
        const domain = ['wa', 'kai119', '.', 'com'].join('');
        const emailAddress = `${mailbox}${String.fromCharCode(64)}${domain}`;
        const subject = '【お問い合わせ】電気工事・お見積もりのご相談';
        const body = [
          '以下をご記入のうえ、送信してください。',
          '',
          '■ お名前',
          '：',
          '',
          '■ 電話番号',
          '：',
          '',
          '■ 工事・訪問先の地域',
          '：',
          '',
          '■ ご相談内容',
          '：',
          '',
          '■ ご希望時期',
          '：',
          '',
          '故障箇所や施工場所のお写真がある場合は、',
          'このメールに添付してお送りください。'
        ].join('\n');

        window.location.href = `mailto:${emailAddress}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      });
    }
  </script>
</body>
</html>
